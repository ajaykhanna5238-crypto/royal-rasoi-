<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Rasoi by Sanjay</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#f2f2f2;}

header{
background:black;
color:gold;
padding:15px;
display:flex;
justify-content:space-between;
}

.section{padding:40px 20px;text-align:center;}

.products{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
}

.card{
background:white;
width:250px;
padding:15px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:150px;
object-fit:cover;
border-radius:8px;
}

.price{color:green;font-weight:bold;margin:8px 0;}

button{
background:gold;
border:none;
padding:8px 12px;
cursor:pointer;
border-radius:5px;
font-weight:bold;
margin-top:5px;
}

.cart-box{
background:white;
padding:20px;
margin:30px auto;
max-width:500px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.cart-item{
display:flex;
justify-content:space-between;
margin:5px 0;
}

input, textarea{
width:100%;
padding:8px;
margin:5px 0;
border-radius:5px;
border:1px solid #ccc;
}

footer{
background:black;
color:white;
text-align:center;
padding:15px;
margin-top:30px;
}
</style>
</head>

<body>

<header>
<h2>👑 Royal Rasoi by Sanjay</h2>
<div>Cart: <span id="cart-count">0</span></div>
</header>

<section class="section">
<h2>Products</h2><br>

<div class="products">

<div class="card">
<img src="https://images.unsplash.com/photo-1586201375761-83865001e17b">
<h3>Steel Bartan</h3>
<p class="price">₹499</p>
<button onclick="addToCart('Steel Bartan',499)">Add</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1590794056226-79ef3a8147e1">
<h3>Pressure Cooker</h3>
<p class="price">₹1499</p>
<button onclick="addToCart('Pressure Cooker',1499)">Add</button>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1604908554168-7c6f3e9f8e0b">
<h3>Dinner Set</h3>
<p class="price">₹999</p>
<button onclick="addToCart('Dinner Set',999)">Add</button>
</div>

</div>

<div class="cart-box">
<h3>Your Cart</h3>
<div id="cart-items"></div>
<hr>
<p><b>Total: ₹<span id="total">0</span></b></p>

<h3>Customer Details</h3>
<input type="text" id="name" placeholder="Your Name">
<input type="text" id="phone" placeholder="Phone Number">
<textarea id="address" placeholder="Full Address"></textarea>

<button onclick="clearCart()">Clear Cart</button>
<button onclick="placeOrder()">Place Order on WhatsApp</button>
</div>

</section>

<footer>
© 2026 Royal Rasoi by Sanjay | All Rights Reserved
</footer>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];
let total = 0;

function calculateTotal(){
total = 0;
cart.forEach(item => total += item.price);
}

function updateCart(){
calculateTotal();
document.getElementById("cart-count").innerText = cart.length;
let itemsDiv = document.getElementById("cart-items");
itemsDiv.innerHTML = "";

cart.forEach((item,index)=>{
itemsDiv.innerHTML += `
<div class="cart-item">
${item.name} - ₹${item.price}
<button onclick="removeItem(${index})">X</button>
</div>`;
});

document.getElementById("total").innerText = total;
localStorage.setItem("cart", JSON.stringify(cart));
}

function addToCart(name,price){
cart.push({name,price});
updateCart();
}

function removeItem(index){
cart.splice(index,1);
updateCart();
}

function clearCart(){
cart=[];
updateCart();
}

function placeOrder(){

let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let address = document.getElementById("address").value;

if(cart.length === 0){
alert("Cart is empty!");
return;
}

if(name==="" || phone==="" || address===""){
alert("Please fill all details!");
return;
}

let message = "New Order:%0A";
message += "Name: "+name+"%0A";
message += "Phone: "+phone+"%0A";
message += "Address: "+address+"%0A%0A";

cart.forEach(item=>{
message += item.name + " - ₹" + item.price + "%0A";
});

message += "%0ATotal: ₹" + total;

window.open("https://wa.me/918950781163?text="+message,"_blank");

cart=[];
updateCart();
}

updateCart();

</script>

</body>
</html>
